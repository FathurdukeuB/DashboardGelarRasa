<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard</title>
<style>
  :root {
    --bg: #f3f4f6;
    --side: #1f2937;
    --side-hover: #374151;
    --accent: #f59e0b;
    --text: #e5e7eb;
    --muted: #9ca3af;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); }
  .app { display: flex; height: 100vh; }

  /* Sidebar */
  .sidebar {
    width: 240px; flex-shrink: 0; background: var(--side); color: var(--text);
    display: flex; flex-direction: column; overflow-y: auto;
  }
  .brand { padding: 20px 18px 14px; font-size: 18px; font-weight: 700; color: #fff; }
  .group-title {
    padding: 14px 18px 6px; font-size: 11px; letter-spacing: .08em;
    text-transform: uppercase; color: var(--muted);
  }
  .nav-item {
    display: block; width: 100%; text-align: left; background: none; border: none;
    color: var(--text); font-size: 14px; padding: 10px 18px; cursor: pointer;
    border-left: 3px solid transparent;
  }
  .nav-item:hover { background: var(--side-hover); }
  .nav-item.active { background: var(--side-hover); border-left-color: var(--accent); color: #fff; font-weight: 600; }

  /* Konten */
  .content { flex: 1; position: relative; padding: 12px; min-width: 0; }
  .frame-wrap { position: relative; width: 100%; height: 100%; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.12); }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
  .loading {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #fff; color: #6b7280; font-size: 14px; transition: opacity .25s;
  }
  .loading.hide { opacity: 0; pointer-events: none; }

  /* Mobile: sidebar jadi bar atas */
  .menu-btn { display: none; }
  @media (max-width: 760px) {
    .app { flex-direction: column; }
    .sidebar { width: 100%; flex-direction: row; overflow-x: auto; overflow-y: hidden; align-items: center; }
    .brand, .group-title { display: none; }
    .nav-item { white-space: nowrap; width: auto; border-left: none; border-bottom: 3px solid transparent; padding: 14px 14px; }
    .nav-item.active { border-bottom-color: var(--accent); }
    .content { padding: 6px; }
  }
</style>
</head>
<body>
<div class="app">
  <nav class="sidebar" id="sidebar"></nav>
  <main class="content">
    <div class="frame-wrap">
      <iframe id="frame" title="Dashboard" allowfullscreen></iframe>
      <div class="loading" id="loading">Memuat dashboard…</div>
    </div>
  </main>
</div>

<script>
/* ============================================================
   BAGIAN YANG PERLU KAMU EDIT
   ------------------------------------------------------------
   1. Ganti "label" dengan nama halaman yang kamu mau tampilkan.
   2. Isi "page" dengan ID halaman (ReportSectionxxxxxxxx) dari URL
      Power BI Service. Kalau masih berisi "ISI_ID", halaman itu
      akan membuka halaman pertama report (default).
   ============================================================ */

const SITE_TITLE = "Dashboard";

const REPORTS = {
  master: "https://app.powerbi.com/view?r=eyJrIjoiOWUxM2E0YjUtNjgwYy00YzFlLTljMjMtMzk5NzhlZDJkNGVlIiwidCI6ImU5N2ZiNWY1LTMzYzctNDg4ZS05MjJhLTMwMzMwNTUzYmM4OCJ9",
  addon:  "https://app.powerbi.com/view?r=eyJrIjoiNzZkYmRjNGUtY2Y0OC00OWQ0LWFmZTktNTUyMGUyYjU5YmE1IiwidCI6ImU5N2ZiNWY1LTMzYzctNDg4ZS05MjJhLTMwMzMwNTUzYmM4OCJ9"
};

const MENU = [
  { group: "Master", items: [
    { label: "Halaman 1", report: "master", page: "b563de4c01d735dc9a02" },               // halaman pertama, tidak perlu ID
    { label: "Halaman 2", report: "master", page: "05529f054e9260460041" }
  ]},
  { group: "Add On", items: [
    { label: "Halaman 3", report: "addon", page: "3b7de6df000ea0e007e0" },                // halaman pertama, tidak perlu ID
    { label: "Halaman 4", report: "addon", page: "3048ef48809506c86c02" },
    { label: "Halaman 5", report: "addon", page: "778f757e5ed4d359364d" }
  ]}
];

/* ============================================================
   KODE DI BAWAH INI TIDAK PERLU DIUBAH
   ============================================================ */
const frame = document.getElementById("frame");
const loading = document.getElementById("loading");
const sidebar = document.getElementById("sidebar");
let buttons = [];

function buildUrl(item) {
  let url = REPORTS[item.report];
  const params = ["navContentPaneEnabled=false", "filterPaneEnabled=false"];
  if (item.page && !item.page.startsWith("ISI_ID")) {
    params.push("pageName=" + encodeURIComponent(item.page));
  }
  return url + "&" + params.join("&");
}

function show(item, btn, index) {
  buttons.forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
  loading.classList.remove("hide");
  frame.src = buildUrl(item);
  history.replaceState(null, "", "#" + index);
}

frame.addEventListener("load", () => loading.classList.add("hide"));

// Bangun sidebar
const brand = document.createElement("div");
brand.className = "brand";
brand.textContent = SITE_TITLE;
sidebar.appendChild(brand);
document.title = SITE_TITLE;

let idx = 0;
const flat = [];
MENU.forEach(g => {
  const t = document.createElement("div");
  t.className = "group-title";
  t.textContent = g.group;
  sidebar.appendChild(t);
  g.items.forEach(item => {
    const b = document.createElement("button");
    b.className = "nav-item";
    b.textContent = item.label;
    const i = idx++;
    b.addEventListener("click", () => show(item, b, i));
    sidebar.appendChild(b);
    buttons.push(b);
    flat.push(item);
  });
});

// Buka halaman sesuai #hash, atau halaman pertama
const start = parseInt(location.hash.replace("#", ""), 10);
const first = (!isNaN(start) && flat[start]) ? start : 0;
show(flat[first], buttons[first], first);
</script>
</body>
</html>
